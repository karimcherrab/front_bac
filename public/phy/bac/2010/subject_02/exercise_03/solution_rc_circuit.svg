<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-label="حل رسم دارة RC واتجاه التيار والتوترات">
  <rect width="100%" height="100%" fill="white"/>
  
<defs>
  <marker id="arrRC2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
  </marker>
</defs>

<!-- source left -->
<circle cx="170" cy="255" r="55" fill="white" stroke="#111827" stroke-width="4"/>
<line x1="170" y1="115" x2="170" y2="200" stroke="#111827" stroke-width="4"/>
<line x1="170" y1="310" x2="170" y2="400" stroke="#111827" stroke-width="4"/>
<text x="100" y="265" font-size="30" font-family="DejaVu Sans,Arial,sans-serif">E</text>

<!-- top wire to capacitor -->
<path d="M170 115 H500" stroke="#111827" stroke-width="4"/>
<!-- capacitor on right upper branch -->
<line x1="500" y1="90" x2="500" y2="160" stroke="#111827" stroke-width="5"/>
<line x1="530" y1="90" x2="530" y2="160" stroke="#111827" stroke-width="5"/>
<path d="M530 125 H680 V215" stroke="#111827" stroke-width="4" fill="none"/>
<text x="515" y="70" text-anchor="middle" font-size="28" font-family="DejaVu Sans,Arial,sans-serif">C</text>

<!-- resistor lower right -->
<rect x="647" y="215" width="66" height="105" fill="white" stroke="#111827" stroke-width="4"/>
<text x="735" y="272" font-size="27" font-family="DejaVu Sans,Arial,sans-serif">R</text>
<path d="M680 320 V400 H400" stroke="#111827" stroke-width="4" fill="none"/>

<!-- switch bottom -->
<circle cx="400" cy="400" r="7" fill="#111827"/>
<circle cx="340" cy="400" r="7" fill="#111827"/>
<line x1="400" y1="400" x2="347" y2="365" stroke="#111827" stroke-width="4"/>
<text x="370" y="350" font-size="27" font-family="DejaVu Sans,Arial,sans-serif">K</text>
<path d="M340 400 H170" stroke="#111827" stroke-width="4"/>

<!-- nodes A/B -->
<circle cx="680" cy="180" r="6" fill="#111827"/>
<circle cx="680" cy="350" r="6" fill="#111827"/>
<text x="705" y="185" font-size="24" font-family="DejaVu Sans,Arial,sans-serif">A</text>
<text x="705" y="355" font-size="24" font-family="DejaVu Sans,Arial,sans-serif">B</text>

<!-- current -->
<line x1="270" y1="82" x2="390" y2="82" stroke="#2563eb" stroke-width="3" marker-end="url(#arrRC2)"/>
<text x="330" y="58" font-size="24" font-family="DejaVu Sans,Arial,sans-serif" fill="#2563eb">i</text>

<!-- voltage arrows -->
<line x1="760" y1="210" x2="760" y2="130" stroke="#2563eb" stroke-width="3" marker-end="url(#arrRC2)"/>
<text x="790" y="175" font-size="22" font-family="DejaVu Sans,Arial,sans-serif" fill="#2563eb">uC</text>
<line x1="760" y1="335" x2="760" y2="220" stroke="#2563eb" stroke-width="3" marker-end="url(#arrRC2)"/>
<text x="790" y="285" font-size="22" font-family="DejaVu Sans,Arial,sans-serif" fill="#2563eb">uR</text>

</svg>