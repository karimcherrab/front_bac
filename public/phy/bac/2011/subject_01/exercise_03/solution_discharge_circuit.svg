<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 510" role="img" aria-label="دارة تفريغ مكثفة عبر مقاومة">
  <rect width="100%" height="100%" fill="white"/>
  
<defs>
  <marker id="arrRC11" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
  </marker>
  <marker id="blueRC11" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
  </marker>
</defs>

<!-- capacitor -->
<path d="M180 125 H330" stroke="#111827" stroke-width="4"/>
<line x1="330" y1="90" x2="330" y2="160" stroke="#111827" stroke-width="5"/>
<line x1="360" y1="90" x2="360" y2="160" stroke="#111827" stroke-width="5"/>
<path d="M360 125 H680 V365 H560" stroke="#111827" stroke-width="4" fill="none"/>
<text x="345" y="68" text-anchor="middle" font-size="29" font-family="DejaVu Sans,Arial,sans-serif" font-style="italic">C</text>
<text x="315" y="188" font-size="25" font-family="DejaVu Sans,Arial,sans-serif">+</text>
<text x="365" y="188" font-size="25" font-family="DejaVu Sans,Arial,sans-serif">−</text>

<!-- switch -->
<circle cx="180" cy="125" r="7" fill="#111827"/>
<circle cx="135" cy="170" r="7" fill="#111827"/>
<line x1="180" y1="125" x2="141" y2="164" stroke="#111827" stroke-width="4"/>
<text x="106" y="143" font-size="27" font-family="DejaVu Sans,Arial,sans-serif" font-style="italic">K</text>
<path d="M135 170 V365 H270" stroke="#111827" stroke-width="4" fill="none"/>

<!-- resistor -->
<rect x="270" y="337" width="155" height="56" fill="white" stroke="#111827" stroke-width="4"/>
<text x="348" y="375" text-anchor="middle" font-size="28" font-family="DejaVu Sans,Arial,sans-serif" font-style="italic">R</text>
<path d="M425 365 H560" stroke="#111827" stroke-width="4"/>

<!-- conventional current during discharge -->
<line x1="175" y1="410" x2="285" y2="410" stroke="#2563eb" stroke-width="3" marker-end="url(#blueRC11)"/>
<text x="230" y="445" text-anchor="middle" font-size="24" font-family="DejaVu Sans,Arial,sans-serif" fill="#2563eb" font-style="italic">i</text>

<!-- voltage arrows -->
<line x1="250" y1="445" x2="445" y2="445" stroke="#2563eb" stroke-width="3" marker-end="url(#blueRC11)"/>
<text x="348" y="480" text-anchor="middle" font-size="23" font-family="DejaVu Sans,Arial,sans-serif" fill="#2563eb">uR</text>
<line x1="410" y1="225" x2="285" y2="225" stroke="#2563eb" stroke-width="3" marker-end="url(#blueRC11)"/>
<text x="348" y="258" text-anchor="middle" font-size="23" font-family="DejaVu Sans,Arial,sans-serif" fill="#2563eb">uC</text>

</svg>