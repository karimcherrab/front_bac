<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 510" role="img" aria-label="الشكل 2: دارة RC ببدالة ذات وضعين">
  <rect width="100%" height="100%" fill="white"/>
  
<defs>
  <marker id="arrow16e2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
  </marker>
</defs>

<!-- generator/top branch -->
<path d="M120 125 H315" stroke="#111827" stroke-width="4" fill="none"/>
<circle cx="390" cy="125" r="48" fill="white" stroke="#111827" stroke-width="4"/>
<path d="M438 125 H670 V300" stroke="#111827" stroke-width="4" fill="none"/>
<line x1="335" y1="70" x2="440" y2="70" stroke="#111827" stroke-width="3" marker-end="url(#arrow16e2)"/>
<text x="387" y="48" text-anchor="middle" font-size="26" font-family="DejaVu Sans,Arial,sans-serif" font-style="italic">E</text>

<!-- left/bottom wire -->
<path d="M120 125 V410 H670" stroke="#111827" stroke-width="4" fill="none"/>

<!-- capacitor -->
<circle cx="165" cy="300" r="5" fill="#111827"/>
<text x="150" y="280" font-size="24" font-family="DejaVu Sans,Arial,sans-serif">D</text>
<line x1="165" y1="300" x2="225" y2="300" stroke="#111827" stroke-width="4"/>
<line x1="225" y1="255" x2="225" y2="345" stroke="#111827" stroke-width="5"/>
<line x1="255" y1="255" x2="255" y2="345" stroke="#111827" stroke-width="5"/>
<text x="238" y="235" text-anchor="middle" font-size="28" font-family="DejaVu Sans,Arial,sans-serif" font-style="italic">C</text>
<circle cx="285" cy="300" r="5" fill="#111827"/>
<text x="276" y="280" font-size="24" font-family="DejaVu Sans,Arial,sans-serif">B</text>
<path d="M255 300 H285" stroke="#111827" stroke-width="4"/>

<!-- resistor -->
<path d="M285 300 H330" stroke="#111827" stroke-width="4"/>
<rect x="330" y="270" width="145" height="60" fill="white" stroke="#111827" stroke-width="4"/>
<text x="402" y="310" text-anchor="middle" font-size="28" font-family="DejaVu Sans,Arial,sans-serif" font-style="italic">R</text>
<path d="M475 300 H520" stroke="#111827" stroke-width="4"/>
<circle cx="520" cy="300" r="5" fill="#111827"/>
<text x="510" y="280" font-size="24" font-family="DejaVu Sans,Arial,sans-serif">A</text>

<!-- switch positions -->
<circle cx="620" cy="260" r="7" fill="#111827"/>
<circle cx="620" cy="355" r="7" fill="#111827"/>
<circle cx="560" cy="300" r="7" fill="#111827"/>
<line x1="560" y1="300" x2="614" y2="263" stroke="#111827" stroke-width="4"/>
<path d="M620 260 H670 M620 355 H670" stroke="#111827" stroke-width="4"/>
<text x="603" y="238" font-size="24" font-family="DejaVu Sans,Arial,sans-serif">1</text>
<text x="603" y="388" font-size="24" font-family="DejaVu Sans,Arial,sans-serif">2</text>
<text x="650" y="300" font-size="27" font-family="DejaVu Sans,Arial,sans-serif" font-style="italic">K</text>

<text x="400" y="485" text-anchor="middle" font-size="23" font-family="DejaVu Sans,Arial,sans-serif" direction="rtl">الشكل 2</text>


<defs>
  <marker id="blue16e2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
  </marker>
</defs>
<!-- current during charging -->
<line x1="640" y1="190" x2="640" y2="245" stroke="#2563eb" stroke-width="3" marker-end="url(#blue16e2)"/>
<text x="660" y="222" font-size="23" font-family="DejaVu Sans,Arial,sans-serif" fill="#2563eb" font-style="italic">i</text>

<!-- uBD capacitor voltage -->
<line x1="170" y1="370" x2="285" y2="370" stroke="#2563eb" stroke-width="3" marker-end="url(#blue16e2)"/>
<text x="228" y="402" text-anchor="middle" font-size="22" font-family="DejaVu Sans,Arial,sans-serif" fill="#2563eb">uBD = uC</text>

<!-- uAB resistor voltage -->
<line x1="285" y1="240" x2="520" y2="240" stroke="#2563eb" stroke-width="3" marker-end="url(#blue16e2)"/>
<text x="402" y="220" text-anchor="middle" font-size="22" font-family="DejaVu Sans,Arial,sans-serif" fill="#2563eb">uAB = uR</text>

<!-- scope -->
<line x1="285" y1="300" x2="285" y2="440" stroke="#2563eb" stroke-width="2.5"/>
<text x="300" y="455" font-size="22" font-family="DejaVu Sans,Arial,sans-serif" fill="#2563eb">Y</text>
<line x1="165" y1="300" x2="165" y2="440" stroke="#2563eb" stroke-width="2.5"/>
<line x1="135" y1="440" x2="195" y2="440" stroke="#2563eb" stroke-width="3"/>
<line x1="145" y1="453" x2="185" y2="453" stroke="#2563eb" stroke-width="3"/>
<line x1="155" y1="466" x2="175" y2="466" stroke="#2563eb" stroke-width="3"/>
</svg>