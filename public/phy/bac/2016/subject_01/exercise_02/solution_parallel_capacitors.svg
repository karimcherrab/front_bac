<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 490" role="img" aria-label="ربط المكثفتين على التفرع">
  <rect width="100%" height="100%" fill="white"/>
  
<defs>
  <marker id="arrPc" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
  </marker>
</defs>
<circle cx="150" cy="250" r="52" fill="white" stroke="#111827" stroke-width="4"/>
<path d="M150 120 V198 M150 302 V380" stroke="#111827" stroke-width="4"/>
<text x="90" y="260" font-size="28" font-family="DejaVu Sans,Arial,sans-serif">E=5V</text>
<path d="M150 120 H680 M150 380 H680" stroke="#111827" stroke-width="4"/>

<!-- C -->
<line x1="350" y1="185" x2="350" y2="255" stroke="#111827" stroke-width="5"/>
<line x1="380" y1="185" x2="380" y2="255" stroke="#111827" stroke-width="5"/>
<path d="M365 120 V185 M365 255 V380" stroke="#111827" stroke-width="4"/>
<text x="365" y="165" text-anchor="middle" font-size="25" font-family="DejaVu Sans,Arial,sans-serif">C=100nF</text>

<!-- C' -->
<line x1="550" y1="185" x2="550" y2="255" stroke="#111827" stroke-width="5"/>
<line x1="580" y1="185" x2="580" y2="255" stroke="#111827" stroke-width="5"/>
<path d="M565 120 V185 M565 255 V380" stroke="#111827" stroke-width="4"/>
<text x="565" y="165" text-anchor="middle" font-size="25" font-family="DejaVu Sans,Arial,sans-serif">C′=200nF</text>

<text x="450" y="450" text-anchor="middle" font-size="25" font-family="DejaVu Sans,Arial,sans-serif" direction="rtl">ربط على التفرع: C_eq = C + C′ = 300 nF</text>

</svg>