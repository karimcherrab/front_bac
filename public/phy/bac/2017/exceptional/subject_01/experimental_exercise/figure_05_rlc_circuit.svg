<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 510" role="img" aria-label="الشكل 5: التركيب الثاني RLC">
<rect width="100%" height="100%" fill="white"/>

<!-- capacitor top -->
<path d="M145 115 H340" stroke="#111827" stroke-width="4"/>
<line x1="340" y1="75" x2="340" y2="155" stroke="#111827" stroke-width="5"/>
<line x1="370" y1="75" x2="370" y2="155" stroke="#111827" stroke-width="5"/>
<path d="M370 115 H735 V365" stroke="#111827" stroke-width="4" fill="none"/>
<text x="355" y="55" text-anchor="middle" font-size="28" font-family="DejaVu Sans,Arial,sans-serif">C</text>

<!-- left return -->
<path d="M145 115 V365 H235" stroke="#111827" stroke-width="4" fill="none"/>

<!-- R -->
<rect x="235" y="332" width="125" height="66" fill="white" stroke="#111827" stroke-width="4"/>
<text x="298" y="375" text-anchor="middle" font-size="28" font-family="DejaVu Sans,Arial,sans-serif">R</text>
<path d="M360 365 H405" stroke="#111827" stroke-width="4"/>

<!-- coil -->
<path d="M405 365
 c18 -30 36 -30 54 0
 c18 30 36 30 54 0
 c18 -30 36 -30 54 0
 c18 30 36 30 54 0" stroke="#111827" stroke-width="4" fill="none"/>
<text x="515" y="325" text-anchor="middle" font-size="27" font-family="DejaVu Sans,Arial,sans-serif">(L , r)</text>
<path d="M621 365 H665" stroke="#111827" stroke-width="4"/>

<!-- switch -->
<circle cx="665" cy="365" r="7" fill="#111827"/>
<circle cx="715" cy="365" r="7" fill="#111827"/>
<line x1="665" y1="365" x2="708" y2="337" stroke="#111827" stroke-width="4"/>
<text x="680" y="320" font-size="27" font-family="DejaVu Sans,Arial,sans-serif">K</text>
<path d="M715 365 H735" stroke="#111827" stroke-width="4"/>

<text x="440" y="485" text-anchor="middle" font-size="24" font-family="DejaVu Sans,Arial,sans-serif" direction="rtl">الشكل 5</text>

</svg>