<text x="478" y="78" font-size="26" font-family="DejaVu Sans,Arial,sans-serif">−</text>
<line x1="505" y1="65" x2="350" y2="65" stroke="#111827" stroke-width="3" marker-end="url(#arr1)"/>
<text x="425" y="43" text-anchor="middle" font-size="27" font-family="DejaVu Sans,Arial,sans-serif" font-style="italic">E</text>

<!-- right switch -->
