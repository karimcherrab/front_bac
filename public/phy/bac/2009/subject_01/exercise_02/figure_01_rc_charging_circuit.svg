<!-- resistor -->
<rect x="260" y="287" width="155" height="56" fill="white" stroke="#111827" stroke-width="4"/>
<text x="338" y="325" text-anchor="middle" font-size="28" font-family="DejaVu Sans,Arial,sans-serif" font-style="italic">R</text>
