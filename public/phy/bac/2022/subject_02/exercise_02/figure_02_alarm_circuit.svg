<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 515" role="img" aria-label="الشكل 2: التركيب المبسط لجهاز الإنذار">
  <rect width="100%" height="100%" fill="white"/>
  
<defs>
  <marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker>
</defs>
<!-- source -->
<circle cx="145" cy="270" r="55" fill="white" stroke="#111827" stroke-width="4"/>
<line x1="145" y1="115" x2="145" y2="215" stroke="#111827" stroke-width="4"/>
<line x1="145" y1="325" x2="145" y2="405" stroke="#111827" stroke-width="4"/>
<line x1="108" y1="320" x2="108" y2="220" stroke="#111827" stroke-width="3" marker-end="url(#arr2)"/>
<text x="78" y="278" font-size="29" font-family="DejaVu Sans,Arial,sans-serif" font-style="italic">E</text>

<!-- contact 1 from source and contact 2 to alarm branch -->
<path d="M145 115 H330" stroke="#111827" stroke-width="4"/>
<circle cx="330" cy="115" r="7" fill="#111827"/>
<circle cx="405" cy="115" r="7" fill="#111827"/>
<text x="320" y="82" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">1</text>
<text x="397" y="82" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">2</text>

<!-- switch common connected to capacitor -->
<circle cx="367" cy="160" r="7" fill="#111827"/>
<line x1="367" y1="160" x2="333" y2="119" stroke="#111827" stroke-width="4"/>
<text x="390" y="171" font-size="25" font-family="DejaVu Sans,Arial,sans-serif" font-style="italic">K</text>

<!-- capacitor -->
<line x1="367" y1="160" x2="367" y2="225" stroke="#111827" stroke-width="4"/>
<line x1="320" y1="225" x2="414" y2="225" stroke="#111827" stroke-width="5"/>
<line x1="320" y1="250" x2="414" y2="250" stroke="#111827" stroke-width="5"/>
<line x1="367" y1="250" x2="367" y2="405" stroke="#111827" stroke-width="4"/>
<text x="430" y="245" font-size="28" font-family="DejaVu Sans,Arial,sans-serif" font-style="italic">C</text>

<!-- resistor R in charging branch -->
<path d="M367 405 H270" stroke="#111827" stroke-width="4"/>
<rect x="190" y="378" width="80" height="54" fill="white" stroke="#111827" stroke-width="4"/>
<text x="230" y="414" text-anchor="middle" font-size="27" font-family="DejaVu Sans,Arial,sans-serif" font-style="italic">R</text>
<path d="M190 405 H145" stroke="#111827" stroke-width="4"/>

<!-- position 2 and alarm control -->
<path d="M405 115 H700 V405 H367" stroke="#111827" stroke-width="4" fill="none"/>
<rect x="535" y="160" width="145" height="180" fill="white" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6"/>
<text x="607" y="205" text-anchor="middle" font-size="19" font-family="DejaVu Sans,Arial,sans-serif" direction="rtl">دارة التحكم في</text>
<text x="607" y="237" text-anchor="middle" font-size="19" font-family="DejaVu Sans,Arial,sans-serif" direction="rtl">صفارة الإنذار</text>
<text x="510" y="285" font-size="27" font-family="DejaVu Sans,Arial,sans-serif">R′</text>
<text x="450" y="475" text-anchor="middle" font-size="23" font-family="DejaVu Sans,Arial,sans-serif" direction="rtl">الشكل 2</text>

</svg>