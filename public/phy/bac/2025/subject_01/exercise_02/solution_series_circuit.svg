<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" role="img" aria-label="حل رسم دارة شحن المكثفة مع جهة التيار والتوترات">
  <rect width="100%" height="100%" fill="white"/>
  
<defs>
  <marker id="arrA" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
  </marker>
</defs>
<!-- loop -->
<circle cx="175" cy="270" r="58" fill="white" stroke="#111827" stroke-width="4"/>
<line x1="175" y1="120" x2="175" y2="212" stroke="#111827" stroke-width="4"/>
<line x1="175" y1="328" x2="175" y2="410" stroke="#111827" stroke-width="4"/>
<path d="M175 120 H335" stroke="#111827" stroke-width="4"/>
<circle cx="335" cy="120" r="7" fill="#111827"/>
<circle cx="380" cy="120" r="7" fill="#111827"/>
<line x1="335" y1="120" x2="374" y2="88" stroke="#111827" stroke-width="4"/>
<text x="345" y="68" font-size="27" font-family="DejaVu Sans,Arial,sans-serif" font-style="italic">K</text>
<path d="M380 120 H665 V190" stroke="#111827" stroke-width="4" fill="none"/>
<!-- R1 -->
<rect x="632" y="190" width="66" height="95" fill="white" stroke="#111827" stroke-width="4"/>
<text x="715" y="245" font-size="27" font-family="DejaVu Sans,Arial,sans-serif">R₁</text>
<line x1="665" y1="285" x2="665" y2="320" stroke="#111827" stroke-width="4"/>
<!-- capacitor -->
<line x1="615" y1="320" x2="715" y2="320" stroke="#111827" stroke-width="5"/>
<line x1="615" y1="347" x2="715" y2="347" stroke="#111827" stroke-width="5"/>
<line x1="665" y1="347" x2="665" y2="410" stroke="#111827" stroke-width="4"/>
<text x="730" y="345" font-size="27" font-family="DejaVu Sans,Arial,sans-serif">C</text>
<!-- variable R bottom -->
<path d="M665 410 H520" stroke="#111827" stroke-width="4"/>
<rect x="400" y="382" width="120" height="56" fill="white" stroke="#111827" stroke-width="4"/>
<line x1="425" y1="445" x2="495" y2="375" stroke="#111827" stroke-width="3" marker-end="url(#arrA)"/>
<text x="460" y="419" text-anchor="middle" font-size="27" font-family="DejaVu Sans,Arial,sans-serif">R</text>
<path d="M400 410 H175" stroke="#111827" stroke-width="4"/>
<text x="105" y="280" font-size="30" font-family="DejaVu Sans,Arial,sans-serif">E</text>

<!-- current clockwise -->
<line x1="215" y1="88" x2="315" y2="88" stroke="#2563eb" stroke-width="3" marker-end="url(#arrA)"/>
<text x="265" y="65" text-anchor="middle" font-size="24" font-family="DejaVu Sans,Arial,sans-serif" fill="#2563eb">i</text>
<!-- E up -->
<line x1="98" y1="330" x2="98" y2="200" stroke="#2563eb" stroke-width="3" marker-end="url(#arrA)"/>
<text x="67" y="274" font-size="23" font-family="DejaVu Sans,Arial,sans-serif" fill="#2563eb">E</text>
<!-- R1 upward -->
<line x1="750" y1="285" x2="750" y2="190" stroke="#2563eb" stroke-width="3" marker-end="url(#arrA)"/>
<text x="780" y="245" font-size="22" font-family="DejaVu Sans,Arial,sans-serif" fill="#2563eb">uR₁</text>
<!-- C upward -->
<line x1="750" y1="380" x2="750" y2="305" stroke="#2563eb" stroke-width="3" marker-end="url(#arrA)"/>
<text x="780" y="350" font-size="22" font-family="DejaVu Sans,Arial,sans-serif" fill="#2563eb">uC</text>
<!-- R arrow from right to left because current on bottom is right-to-left -->
<line x1="535" y1="470" x2="385" y2="470" stroke="#2563eb" stroke-width="3" marker-end="url(#arrA)"/>
<text x="460" y="500" text-anchor="middle" font-size="22" font-family="DejaVu Sans,Arial,sans-serif" fill="#2563eb">uR</text>

</svg>