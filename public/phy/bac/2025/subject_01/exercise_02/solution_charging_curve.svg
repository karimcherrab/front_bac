<!-- curve -->
<path d="M125 450 C170 280, 235 180, 330 142 C430 102, 575 121, 760 120"
      fill="none" stroke="#111827" stroke-width="5"/>
<!-- 5 tau -->
<line x1="585" y1="450" x2="585" y2="120" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="8 6"/>
