<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="التمثيل الكيفي لتوتر المكثفة أثناء الشحن">
  <rect width="100%" height="100%" fill="white"/>
  
<defs>
  <marker id="axisA" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker>
</defs>
<line x1="125" y1="450" x2="795" y2="450" stroke="#111827" stroke-width="3" marker-end="url(#axisA)"/>
<line x1="125" y1="450" x2="125" y2="70" stroke="#111827" stroke-width="3" marker-end="url(#axisA)"/>
<text x="805" y="460" font-size="24" font-family="DejaVu Sans,Arial,sans-serif" font-style="italic">t</text>
<text x="48" y="70" font-size="25" font-family="DejaVu Sans,Arial,sans-serif" font-style="italic">uC(V)</text>
