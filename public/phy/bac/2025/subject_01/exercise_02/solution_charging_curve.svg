<text x="330" y="335" text-anchor="middle" font-size="23" font-family="DejaVu Sans,Arial,sans-serif" direction="rtl">نظام انتقالي</text>
<text x="680" y="185" text-anchor="middle" font-size="23" font-family="DejaVu Sans,Arial,sans-serif" direction="rtl">نظام دائم</text>

