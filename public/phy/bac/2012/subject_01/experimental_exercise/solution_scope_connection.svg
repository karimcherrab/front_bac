<rect x="617" y="375" width="66" height="95" fill="white" stroke="#111827" stroke-width="4"/>
<text x="705" y="430" font-size="27" font-family="DejaVu Sans,Arial,sans-serif" font-style="italic">R</text>

<!-- close bottom wire -->
<path d="M650 470 H170 V410" stroke="#111827" stroke-width="4" fill="none"/>

<text x="420" y="515" text-anchor="middle" font-size="23" font-family="DejaVu Sans,Arial,sans-serif" direction="rtl">الشكل 4</text>


