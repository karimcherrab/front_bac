<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-label="التمثيل الكيفي لشدة تيار تفريغ المكثفة">
  <rect width="100%" height="100%" fill="white"/>
  
<defs>
  <marker id="axisarr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
  </marker>
</defs>
<line x1="125" y1="220" x2="790" y2="220" stroke="#111827" stroke-width="3" marker-end="url(#axisarr)"/>
<line x1="125" y1="430" x2="125" y2="65" stroke="#111827" stroke-width="3" marker-end="url(#axisarr)"/>
<text x="805" y="229" font-size="25" font-family="DejaVu Sans,Arial,sans-serif" font-style="italic">t(ms)</text>
<text x="55" y="70" font-size="25" font-family="DejaVu Sans,Arial,sans-serif" font-style="italic">i(mA)</text>
<text x="95" y="244" font-size="19" font-family="DejaVu Sans,Arial,sans-serif">0</text>
<text x="55" y="405" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">−I₀</text>
<!-- negative exponential rising from -I0 to 0 -->
<path d="M125 395 C205 290, 300 248, 420 231 C535 218, 650 220, 770 220"
      fill="none" stroke="#111827" stroke-width="5"/>
<line x1="125" y1="395" x2="175" y2="395" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="6 5"/>
<text x="315" y="342" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">i(t)=−I₀e<tspan baseline-shift="super" font-size="17">−t/RC</tspan></text>

</svg>