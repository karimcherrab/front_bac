<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="الشكل 5: التركيب الكهربائي لشحن وتفريغ المكثفة">
  <rect width="100%" height="100%" fill="white"/>
  
<defs>
  <marker id="arrow5" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
  </marker>
</defs>

<!-- common bottom wire -->
<path d="M145 410 H730" fill="none" stroke="#111827" stroke-width="4"/>

<!-- G1 ideal voltage source -->
<path d="M145 410 V330" fill="none" stroke="#111827" stroke-width="4"/>
<circle cx="145" cy="265" r="58" fill="white" stroke="#111827" stroke-width="4"/>
<path d="M145 207 V125 H315" fill="none" stroke="#111827" stroke-width="4"/>
<text x="75" y="275" font-size="30" font-family="DejaVu Sans,Arial,sans-serif" font-style="italic">G₁</text>
<text x="125" y="190" font-size="31" font-family="DejaVu Sans,Arial,sans-serif">+</text>
<text x="126" y="350" font-size="31" font-family="DejaVu Sans,Arial,sans-serif">−</text>

<!-- Capacitor + resistor branch -->
<line x1="370" y1="200" x2="370" y2="245" stroke="#111827" stroke-width="4"/>
<line x1="318" y1="245" x2="422" y2="245" stroke="#111827" stroke-width="5"/>
<line x1="318" y1="272" x2="422" y2="272" stroke="#111827" stroke-width="5"/>
<line x1="370" y1="272" x2="370" y2="315" stroke="#111827" stroke-width="4"/>
<rect x="337" y="315" width="66" height="95" fill="white" stroke="#111827" stroke-width="4"/>
<text x="285" y="266" font-size="29" font-family="DejaVu Sans,Arial,sans-serif" font-style="italic">C</text>
<text x="290" y="370" font-size="29" font-family="DejaVu Sans,Arial,sans-serif" font-style="italic">R</text>

<!-- switch common -->
<circle cx="370" cy="190" r="7" fill="#111827"/>
<line x1="370" y1="190" x2="408" y2="140" stroke="#111827" stroke-width="4"/>
<text x="330" y="158" font-size="28" font-family="DejaVu Sans,Arial,sans-serif" font-style="italic">K</text>

<!-- position 1 -->
<circle cx="315" cy="125" r="7" fill="#111827"/>
<text x="305" y="92" font-size="25" font-family="DejaVu Sans,Arial,sans-serif">1</text>

<!-- positions 3 and 2 on the right -->
<circle cx="485" cy="125" r="7" fill="#111827"/>
<circle cx="485" cy="195" r="7" fill="#111827"/>
<text x="474" y="92" font-size="25" font-family="DejaVu Sans,Arial,sans-serif">3</text>
<text x="474" y="174" font-size="25" font-family="DejaVu Sans,Arial,sans-serif">2</text>

<!-- position 2 directly closes RC discharge loop -->
<path d="M485 195 H525 V410" fill="none" stroke="#111827" stroke-width="4"/>

<!-- G2 branch connected to position 3 -->
<path d="M485 125 H690 V200" fill="none" stroke="#111827" stroke-width="4"/>
<circle cx="690" cy="265" r="58" fill="white" stroke="#111827" stroke-width="4"/>
<path d="M690 323 V410" fill="none" stroke="#111827" stroke-width="4"/>
<!-- visible source mark as in source document -->
<line x1="650" y1="265" x2="730" y2="265" stroke="#111827" stroke-width="4"/>
<text x="755" y="275" font-size="30" font-family="DejaVu Sans,Arial,sans-serif" font-style="italic">G₂</text>

<!-- u_G2 arrow outside the branch -->
<line x1="595" y1="345" x2="595" y2="185" stroke="#111827" stroke-width="3" marker-end="url(#arrow5)"/>
<text x="535" y="278" font-size="27" font-family="DejaVu Sans,Arial,sans-serif">u<tspan baseline-shift="sub" font-size="20">G2</tspan></text>

<rect x="332" y="440" width="150" height="55" rx="10" fill="white" stroke="#111827" stroke-width="2"/>
<text x="407" y="476" text-anchor="middle" font-size="24" font-family="DejaVu Sans,Arial,sans-serif" direction="rtl">الشكل (5)</text>

</svg>