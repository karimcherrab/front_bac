<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" role="img" aria-label="حل الوضع 1: اتجاه التيار والتوترات وربط راسم الاهتزاز">
  <rect width="100%" height="100%" fill="white"/>
  
<defs>
  <marker id="bluearr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
  </marker>
</defs>
<!-- loop -->
<circle cx="175" cy="270" r="58" fill="white" stroke="#111827" stroke-width="4"/>
<path d="M175 212 V120 H540" fill="none" stroke="#111827" stroke-width="4"/>
<path d="M175 328 V420 H410" fill="none" stroke="#111827" stroke-width="4"/>
<text x="105" y="280" font-size="30" font-family="DejaVu Sans,Arial,sans-serif" font-style="italic">G₁</text>
<text x="157" y="198" font-size="30" font-family="DejaVu Sans,Arial,sans-serif">+</text>
<text x="157" y="350" font-size="30" font-family="DejaVu Sans,Arial,sans-serif">−</text>
<!-- switch closed in 1 -->
<circle cx="345" cy="120" r="7" fill="#111827"/>
<circle cx="390" cy="160" r="7" fill="#111827"/>
<line x1="390" y1="160" x2="349" y2="123" stroke="#111827" stroke-width="4"/>
<text x="360" y="95" font-size="25" font-family="DejaVu Sans,Arial,sans-serif">1</text>
<text x="405" y="157" font-size="25" font-family="DejaVu Sans,Arial,sans-serif" font-style="italic">K</text>
<!-- C and R -->
<line x1="390" y1="160" x2="390" y2="220" stroke="#111827" stroke-width="4"/>
<line x1="340" y1="220" x2="440" y2="220" stroke="#111827" stroke-width="5"/>
<line x1="340" y1="248" x2="440" y2="248" stroke="#111827" stroke-width="5"/>
<line x1="390" y1="248" x2="390" y2="305" stroke="#111827" stroke-width="4"/>
<rect x="357" y="305" width="66" height="100" fill="white" stroke="#111827" stroke-width="4"/>
<line x1="390" y1="405" x2="390" y2="420" stroke="#111827" stroke-width="4"/>
<text x="462" y="242" font-size="27" font-family="DejaVu Sans,Arial,sans-serif">C</text>
<text x="462" y="365" font-size="27" font-family="DejaVu Sans,Arial,sans-serif">R</text>
<!-- current -->
<line x1="205" y1="92" x2="315" y2="92" stroke="#2563eb" stroke-width="3" marker-end="url(#bluearr)"/>
<text x="260" y="68" text-anchor="middle" font-size="24" font-family="DejaVu Sans,Arial,sans-serif" fill="#2563eb" font-style="italic">i</text>
<!-- uC, uR, E -->
<line x1="485" y1="273" x2="485" y2="195" stroke="#2563eb" stroke-width="3" marker-end="url(#bluearr)"/>
<text x="510" y="240" font-size="23" font-family="DejaVu Sans,Arial,sans-serif" fill="#2563eb">uC</text>
<line x1="485" y1="405" x2="485" y2="305" stroke="#2563eb" stroke-width="3" marker-end="url(#bluearr)"/>
<text x="510" y="365" font-size="23" font-family="DejaVu Sans,Arial,sans-serif" fill="#2563eb">uR</text>
<line x1="95" y1="335" x2="95" y2="205" stroke="#2563eb" stroke-width="3" marker-end="url(#bluearr)"/>
<text x="65" y="277" font-size="23" font-family="DejaVu Sans,Arial,sans-serif" fill="#2563eb">E</text>
<!-- oscilloscope Y / ground connected across C -->
<circle cx="390" cy="205" r="6" fill="#2563eb"/>
<line x1="390" y1="205" x2="650" y2="205" stroke="#2563eb" stroke-width="2.5"/>
<text x="670" y="213" font-size="24" font-family="DejaVu Sans,Arial,sans-serif" fill="#2563eb">Y</text>
<circle cx="390" cy="263" r="6" fill="#2563eb"/>
<line x1="390" y1="263" x2="610" y2="263" stroke="#2563eb" stroke-width="2.5"/>
<line x1="610" y1="263" x2="610" y2="310" stroke="#2563eb" stroke-width="2.5"/>
<line x1="575" y1="310" x2="645" y2="310" stroke="#2563eb" stroke-width="3"/>
<line x1="586" y1="323" x2="634" y2="323" stroke="#2563eb" stroke-width="3"/>
<line x1="596" y1="336" x2="624" y2="336" stroke="#2563eb" stroke-width="3"/>

</svg>